<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="box">
<h2>To-Do List</h2>
<div class="top"><input type="text" id="task" placeholder="Enter a task"><button id="add">Add Task</button></div>
<p class="hint">Click on a task to mark it as completed</p>
<ul id="list"></ul>
<p id="count"></p>
</div>
<script src="script.js"></script>
</body>
</html>
