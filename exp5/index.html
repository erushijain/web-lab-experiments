<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Weather App</title>
<style>
body{font-family:Arial,sans-serif;background:#eef2f7;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:#fff;width:320px;padding:25px;border-radius:8px;box-shadow:0 2px 10px #0002;text-align:center}
input{width:60%;padding:8px;border:1px solid #bbb;border-radius:4px}
button{padding:8px 14px;background:#2c5282;color:#fff;border:0;border-radius:4px;cursor:pointer}
#result{margin-top:20px;line-height:1.8}
#temp{font-size:40px;font-weight:bold;color:#2c5282}
</style>
</head>
<body>
<div class="box">
<h2>Weather App</h2>
<input id="city" placeholder="Enter city name">
<button onclick="getWeather()">Search</button>
<div id="result"></div>
</div>
<script>
async function getWeather(){
 const c=document.getElementById("city").value.trim(),out=document.getElementById("result");
 if(!c){out.innerHTML="Please enter a city name";return;}
 try{
  const g=await(await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(c)}&count=1`)).json();
  if(!g.results){out.innerHTML="City not found";return;}
  const{latitude:la,longitude:lo,name,country}=g.results[0];
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current_weather=true`);
  const w=(await r.json()).current_weather;
  out.innerHTML=`<b>${name}, ${country}</b><div id="temp">${w.temperature}°C</div>Wind Speed: ${w.windspeed} km/h`;
 }catch(e){out.innerHTML="Error fetching data";}
}
</script>
</body>
</html>
